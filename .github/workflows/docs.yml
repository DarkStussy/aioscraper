name: Docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "aioscraper/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "tests/test_docs.py"
      - "pyproject.toml"
      - ".readthedocs.yaml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "aioscraper/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "tests/test_docs.py"
      - "pyproject.toml"
      - ".readthedocs.yaml"
  workflow_call:

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # Mirrors .readthedocs.yaml: same Python, same extras, warnings as errors.
      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build with warnings as errors
        run: >-
          uv run --python 3.12 --isolated
          --with-requirements docs/requirements.txt
          --extra aiohttp --extra httpx --extra httpx2
          sphinx-build -W -b html docs docs/_build/html

      # Compiles every snippet in README.md and docs/*.rst. Run on the oldest supported
      # Python, where a snippet using newer syntax fails.
      - name: Check documentation snippets
        run: >-
          uv run --python 3.11 --extra aiohttp --extra httpx --extra httpx2
          pytest -q tests/test_docs.py

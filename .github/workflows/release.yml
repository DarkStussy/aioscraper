name: Publish package to PyPI

on:
  release:
    types: [ published ]

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag against project version and changelog
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="$(python3 -c "
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")"
          tag="${TAG#v}"

          if [ "$tag" != "$version" ]; then
            echo "::error::tag '${TAG}' does not match project.version '${version}'"
            exit 1
          fi

          if ! grep -qE "^## ${version}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' section"
            exit 1
          fi

          if grep -qE "^## Unreleased( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still has an 'Unreleased' section"
            exit 1
          fi

          echo "release ${version} verified"

  tests:
    name: Tests
    needs:
      - verify
    uses: ./.github/workflows/tests.yml

  docs:
    name: Docs
    needs:
      - verify
    uses: ./.github/workflows/docs.yml

  build:
    name: Build distribution
    needs:
      - tests
      - docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine --isolated twine check --strict dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: >-
      Publish distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aioscraper
    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: Tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yml"
      - "aioscraper/**"
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".pytest.toml"
      - ".ruff.toml"
      - "pyrightconfig.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yml"
      - "aioscraper/**"
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".pytest.toml"
      - ".ruff.toml"
      - "pyrightconfig.json"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --python 3.11

      - name: Lint code
        run: |
          uv run --python 3.11 --no-sync ruff check --output-format=github aioscraper examples tests
          uv run --python 3.11 --no-sync ruff format --check --diff aioscraper tests

  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra aiohttp --extra httpx --extra httpx2

      - name: Type check
        run: uv run --python ${{ matrix.python-version }} basedpyright aioscraper tests

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v

  minimum-dependencies:
    name: Minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      # Resolves every direct dependency to its declared floor, so the lower bounds
      # in pyproject.toml stay honest. The lockfile rewrite is local to the runner.
      - name: Install lowest supported dependencies
        run: uv sync --python 3.11 --resolution lowest-direct --extra aiohttp --extra httpx --extra httpx2

      - name: Report resolved versions
        run: uv run --python 3.11 --no-sync python -c "import aiohttp, httpx, httpx2; print('aiohttp', aiohttp.__version__, '| httpx', httpx.__version__, '| httpx2', httpx2.__version__)"

      - name: Run tests
        run: uv run --python 3.11 --no-sync pytest -q

  extras:
    name: Install (${{ matrix.extra || 'no backend' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        extra:
          - ""
          - "aiohttp"
          - "httpx"
          - "httpx2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      # Every other job installs all three backends together, where an import of one leaking
      # outside its own module goes unnoticed.
      - name: Install
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          uv venv --python 3.11 "${RUNNER_TEMP}/extra-env"
          uv pip install --python "${RUNNER_TEMP}/extra-env/bin/python" ".${EXTRA:+[$EXTRA]}"

      # -I keeps the checkout off sys.path, so this exercises the installed package.
      - name: Check what the install can and cannot do
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          "${RUNNER_TEMP}/extra-env/bin/python" -I - <<'PY'
          import os

          import aioscraper
          from aioscraper.config import SessionConfig
          from aioscraper.core.session.factory import get_sessionmaker
          from aioscraper.exceptions import AIOScraperException

          extra = os.environ["EXTRA"]

          for backend in ("aiohttp", "httpx", "httpx2"):
              if backend == extra:
                  continue

              try:
                  __import__(backend)
              except ModuleNotFoundError:
                  continue

              raise SystemExit(f"{backend} is installed, but no extra asked for it")

          if extra:
              get_sessionmaker(SessionConfig())
              get_sessionmaker(SessionConfig(http_backend=extra))
              print(f"{extra}: auto-detected and selected explicitly")
          else:
              try:
                  get_sessionmaker(SessionConfig())
              except AIOScraperException as exc:
                  print(f"no backend: {exc}")
              else:
                  raise SystemExit("an install without extras must not resolve a backend")

          print(aioscraper.__all__)
          PY
          "${RUNNER_TEMP}/extra-env/bin/aioscraper" --help

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --extra aiohttp --extra httpx --extra httpx2

      # Threshold lives in pyproject.toml so local runs fail the same way.
      - name: Run tests with coverage
        run: uv run --python 3.12 pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine --isolated twine check dist/*

      - name: Install the built wheel into a clean environment
        run: |
          uv venv "${RUNNER_TEMP}/wheel-env"
          uv pip install --python "${RUNNER_TEMP}/wheel-env/bin/python" "$(ls dist/*.whl)[aiohttp,httpx,httpx2]"

      # -I keeps the repository checkout off sys.path, so this imports the installed
      # wheel and not the source tree it was built from.
      - name: Import every backend and smoke-test the CLI
        run: |
          "${RUNNER_TEMP}/wheel-env/bin/python" -I -c "
          import pathlib
          import aioscraper
          from aioscraper.core.session.aiohttp import AiohttpSession
          from aioscraper.core.session.httpx import HttpxSession
          from aioscraper.core.session.httpx2 import Httpx2Session
          assert (pathlib.Path(aioscraper.__file__).parent / 'py.typed').is_file(), 'py.typed missing'
          print(aioscraper.__all__)
          "
          "${RUNNER_TEMP}/wheel-env/bin/aioscraper" --help

name: Tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yml"
      - "aioscraper/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".pytest.toml"
      - ".ruff.toml"
      - "pyrightconfig.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yml"
      - "aioscraper/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".pytest.toml"
      - ".ruff.toml"
      - "pyrightconfig.json"
  workflow_call:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra aiohttp --extra httpx

      - name: Lint code
        run: |
          uv run --python ${{ matrix.python-version }} ruff check --output-format=github aioscraper examples tests
          uv run --python ${{ matrix.python-version }} basedpyright aioscraper tests
          uv run --python ${{ matrix.python-version }} ruff format --check --diff aioscraper tests

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v

  minimum-dependencies:
    name: Minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      # Resolves every direct dependency to its declared floor, so the lower bounds
      # in pyproject.toml stay honest. The lockfile rewrite is local to the runner.
      - name: Install lowest supported dependencies
        run: uv sync --python 3.11 --resolution lowest-direct --extra aiohttp --extra httpx

      - name: Report resolved versions
        run: uv run --python 3.11 --no-sync python -c "import aiohttp, httpx; print('aiohttp', aiohttp.__version__, '| httpx', httpx.__version__)"

      - name: Run tests
        run: uv run --python 3.11 --no-sync pytest -q

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --extra aiohttp --extra httpx

      # Threshold lives in pyproject.toml so local runs fail the same way.
      - name: Run tests with coverage
        run: uv run --python 3.12 pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine --isolated twine check dist/*

      - name: Install the built wheel into a clean environment
        run: |
          uv venv "${RUNNER_TEMP}/wheel-env"
          uv pip install --python "${RUNNER_TEMP}/wheel-env/bin/python" "$(ls dist/*.whl)[aiohttp,httpx]"

      # -I keeps the repository checkout off sys.path, so this imports the installed
      # wheel and not the source tree it was built from.
      - name: Import both backends and smoke-test the CLI
        run: |
          "${RUNNER_TEMP}/wheel-env/bin/python" -I -c "
          import pathlib
          import aioscraper
          from aioscraper.core.session.aiohttp import AiohttpSession
          from aioscraper.core.session.httpx import HttpxSession
          assert (pathlib.Path(aioscraper.__file__).parent / 'py.typed').is_file(), 'py.typed missing'
          print(aioscraper.__all__)
          "
          "${RUNNER_TEMP}/wheel-env/bin/aioscraper" --help
